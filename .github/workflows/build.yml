name: Build and deploy Pinpanion
run-name: ${{ github.actor }} running the Pinpanion checks.

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and lint
        run: npm test
        env:
          # Let jsdom provide browser storage instead of Node's native globals.
          NODE_OPTIONS: --no-experimental-webstorage

      - name: Cache pin images
        id: cache-images
        uses: actions/cache@v6
        with:
          path: cached-images
          key: ${{ runner.os }}-images

      - name: Build the main site
        run: |
          mkdir -p cached-images public/imgs
          touch cached-images/empty.txt
          npm run download -- cached-images
          cp -Rf cached-images/* public/imgs || true
          npm run build:vite

  deploy-cloudflare:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }

      - name: Build production Pages projects
        run: |
          npm run build:guess
          npm run build:pingo

      - name: Deploy Guess Who to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy build/guess --project-name pinpanion-guess --branch main

      - name: Deploy PAX Aus portal to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:aus

      - name: Deploy Pingo to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PINGO_PROD_D1_DATABASE_ID: ${{ vars.PINGO_PROD_D1_DATABASE_ID }}
        run: node scripts/deploy-pingo.mjs prod
