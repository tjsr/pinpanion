version: 2
updates:
  - package-ecosystem: "npm"
    rebase-strategy: auto
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: '@types/node'
        update-types: ["version-update:semver-major"]
    groups:
      linter:
        applies-to: version-updates
        patterns:
          - "@tjsr/eslint-config"
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "@stylistic/*"
      mui:
        applies-to: version-updates
        patterns:
        - "@mui/*"
      react:
        applies-to: version-updates
        patterns:
        - "@types/react"
        - "@types/react-dom"
        - "react"
        - "react-dom"

  - package-ecosystem: "github-actions"
    rebase-strategy: auto
    directory: "/"
    schedule:
      interval: "weekly"
